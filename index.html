<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>コースターシューティング</title>

  <!-- 安定動作版ライブラリ -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #fff; }

    /* スタート画面 (明るい白背景ベース) */
    #start-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 999;
      background: rgba(255, 255, 255, 0.95); display: flex; flex-direction: column;
      justify-content: center; align-items: center; color: #0088cc; text-align: center; padding: 25px;
      backdrop-filter: blur(5px);
    }
    #start-overlay h2 {
      font-size: 26px; font-weight: 800; color: #0099e6; letter-spacing: 1px; margin-bottom: 10px;
    }
    #start-overlay p {
      font-size: 14px; color: #557799; line-height: 1.5;
    }
    #start-btn {
      background: #00aaff; color: #fff; border: none; padding: 18px 45px;
      font-size: 20px; font-weight: bold; border-radius: 40px; margin-top: 30px;
      box-shadow: 0 4px 15px rgba(0, 170, 255, 0.4); cursor: pointer;
      transition: transform 0.1s ease;
    }
    #start-btn:active { transform: scale(0.96); }

    /* UIレイヤー (HUD) */
    #ui-layer {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10;
      display: flex; flex-direction: column; justify-content: space-between; padding: 20px;
      pointer-events: none;
    }

    .hud-header {
      display: flex; justify-content: space-between; align-items: center;
      color: #00aaff; font-size: 20px; font-weight: 800;
      background: rgba(255, 255, 255, 0.85); padding: 12px 20px; border-radius: 30px;
      box-shadow: 0 2px 10px rgba(0, 150, 255, 0.15); border: 1px solid rgba(0, 170, 255, 0.3);
    }

    /* 中央照準 (水色デザイン) */
    .crosshair {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 64px; height: 64px; border: 3px solid rgba(0, 170, 255, 0.8); border-radius: 50%;
      pointer-events: none; box-shadow: 0 0 10px rgba(0, 170, 255, 0.3);
    }
    .crosshair::after {
      content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 10px; height: 10px; background: #00aaff; border-radius: 50%;
      box-shadow: 0 0 6px rgba(0, 170, 255, 0.8);
    }

    /* 射撃・命中演出フラッシュ */
    #hit-flash {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5;
      background: rgba(0, 200, 255, 0.3); opacity: 0; transition: opacity 0.08s ease;
      pointer-events: none;
    }
    #shot-flash {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 4;
      background: rgba(255, 255, 255, 0.3); opacity: 0; transition: opacity 0.05s ease;
      pointer-events: none;
    }

    /* リザルト画面 (爽やかな白・水色基調) */
    #result-modal {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 100;
      background: rgba(255, 255, 255, 0.96); color: #0077bb; display: none;
      flex-direction: column; align-items: center; justify-content: center; padding: 30px; text-align: center;
    }
    #result-modal h1 { color: #0099e6; font-size: 30px; font-weight: 800; margin-bottom: 8px; }
    #result-modal p { color: #6688aa; font-size: 15px; }
    .score-box {
      font-size: 42px; font-weight: 900; color: #00aaff; margin: 20px 0;
      text-shadow: 0 2px 10px rgba(0, 170, 255, 0.2);
    }
    .btn-retry {
      background: #00aaff; color: #fff; border: none; padding: 16px 40px;
      font-size: 18px; font-weight: bold; border-radius: 30px; cursor: pointer;
      box-shadow: 0 4px 12px rgba(0, 170, 255, 0.3);
    }
  </style>
</head>
<body>

  <!-- スタート画面 -->
  <div id="start-overlay">
    <h2></h2>
    <p><br>ターゲットに狙いを定めて撃ち抜こう！</p>
    <button id="startby-btn">GAME START</button>
  </div>

  <!-- HUD・スコア表示 -->
  <div id="ui-layer">
    <div class="hud-header">
      <div>SCORE: <span id="score-val">0</span></div>
      <div></div>
    </div>
    <div class="crosshair"></div>
  </div>

  <!-- エフェクト用レイヤー -->
  <div id="hit-flash"></div>
  <div id="shot-flash"></div>

  <!-- 終了画面 -->
  <div id="result-modal">
    <h1>MISSION COMPLETE!</h1>
    <p>救出作戦が完了しました！</p>
    <div class="score-box"><span id="final-score">0</span> <span style="font-size:20px;">PT</span></div>
    <button class="btn-retry" onclick="location.reload()">もう一度リトライ</button>
  </div>

  <!-- AR Scene (認識システム) -->
  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiLoading: no; uiError: yes;" 
    color-space="sRGB" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">
    
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-entity id="target-0" mindar-image-target="targetIndex: 0"></a-entity>
  </a-scene>

  <script>
    let score = 0;
    let isTargetVisible = false;
    let isCoolingDown = false;
    let isGameStarted = false;

    const scoreVal = document.getElementById('score-val');
    const hitFlash = document.getElementById('hit-flash');
    const shotFlash = document.getElementById('shot-flash');
    const targetEntity = document.querySelector('#target-0');
    const startOverlay = document.getElementById('start-overlay');
    const startBtn = document.getElementById('start-btn');

    let audioCtx;

    // 効果音生成 (Web Audio API)
    function playShotSE() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(600, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.12);
      gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.12);
    }

    function playHitSE() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(400, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.2);
      gain.gain.setValueAtTime(0.35, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.2);
    }

    // ゲーム開始処理
    startBtn.addEventListener('click', async () => {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') await audioCtx.resume();

      const sceneEl = document.querySelector('a-scene');
      const arSystem = sceneEl.systems["mindar-image-system"];

      try {
        await arSystem.start();

        // カメラ背景のフィッティング
        const video = document.querySelector('video');
        if (video) {
          video.style.position = 'absolute';
          video.style.top = '0';
          video.style.left = '0';
          video.style.width = '100vw';
          video.style.height = '100vh';
          video.style.objectFit = 'cover';
          video.style.zIndex = '1';
        }

        startOverlay.style.display = 'none';
        isGameStarted = true;

        // 40秒でゲーム終了（リザルト表示）
        setTimeout(() => {
          document.getElementById('result-modal').style.display = 'flex';
          document.getElementById('final-score').textContent = score;
        }, 40000);

      } catch (err) {
        alert("起動エラー: " + err.message);
      }
    });

    // ターゲット検知・見失い時のフラグ切り替え
    targetEntity.addEventListener("targetFound", () => { isTargetVisible = true; });
    targetEntity.addEventListener("targetLost", () => { isTargetVisible = false; });

    // 画面タップで射撃
    window.addEventListener('pointerdown', (e) => {
      if (!isGameStarted || e.target === startBtn || e.target.classList.contains('btn-retry')) return;

      playShotSE();
      shotFlash.style.opacity = '1';
      setTimeout(() => { shotFlash.style.opacity = '0'; }, 50);

      // マーカーを捉えていれば得点追加
      if (isTargetVisible && !isCoolingDown) {
        score += 100;
        scoreVal.textContent = score;
        playHitSE();

        hitFlash.style.opacity = '1';
        setTimeout(() => { hitFlash.style.opacity = '0'; }, 120);

        isCoolingDown = true;
        setTimeout(() => { isCoolingDown = false; }, 800);
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>フランクフルト＆ホットドッグ モバイル注文・整理券管理</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    @keyframes pulse-glow {
      0%, 100% { transform: scale(1); border-color: #22c55e; box-shadow: 0 0 10px rgba(34, 197, 94, 0.2); }
      50% { transform: scale(1.03); border-color: #16a34a; box-shadow: 0 0 20px rgba(34, 197, 94, 0.5); }
    }
    .animate-ready {
      animation: pulse-glow 1.5s infinite ease-in-out;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col font-sans pb-10">

  <!-- ヘッダー -->
  <header class="bg-red-600 text-white px-4 py-3 shadow-md flex justify-between items-center sticky top-0 z-30">
    <div class="flex items-center gap-3">
      <!-- 5回タップターゲット -->
      <span id="logo-icon" class="text-2xl cursor-pointer active:scale-95 transition-transform p-1">🌭</span>
      <h1 class="text-base font-bold tracking-tight">高専祭 モバイル注文</h1>
    </div>

    <div class="flex items-center gap-2">
      <!-- スタッフ画面等への切り替えボタン -->
      <button id="btn-show-order-page" class="bg-white/20 hover:bg-white/30 text-white text-xs font-bold px-2.5 py-1.5 rounded-lg border border-white/30">
        <i class="fa-solid fa-cart-shopping mr-1"></i>注文へ
      </button>
      <button id="btn-show-monitor-page" class="bg-white/20 hover:bg-white/30 text-white text-xs font-bold px-2.5 py-1.5 rounded-lg border border-white/30">
        <i class="fa-solid fa-desktop mr-1"></i>モニター
      </button>
      <button id="btn-logout-staff" class="hidden bg-slate-900 text-white text-xs font-bold px-2.5 py-1.5 rounded-lg shadow">
        ログアウト
      </button>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="flex-1 max-w-4xl w-full mx-auto p-4">

    <!-- 1. お客様用 注文画面 -->
    <section id="view-customer-order" class="space-y-6">
      
      <!-- 注文完了カード (初期非表示) -->
      <div id="order-success-card" class="hidden bg-emerald-50 border-2 border-emerald-500 rounded-2xl p-6 text-center space-y-3 shadow-md">
        <span class="text-emerald-600 text-4xl"><i class="fa-solid fa-circle-check"></i></span>
        <h2 class="text-xl font-extrabold text-emerald-800">ご注文を受け付けました！</h2>
        <div class="bg-white rounded-xl p-4 border border-emerald-200 inline-block w-full max-w-xs shadow-inner">
          <p class="text-xs text-slate-500 font-bold">あなたの整理券番号</p>
          <div id="my-ticket-number" class="text-5xl font-black text-emerald-600 my-1">#--</div>
          <p id="my-ticket-detail" class="text-xs text-slate-600 font-medium"></p>
        </div>
        <div class="bg-amber-100 border border-amber-300 text-amber-900 p-3 rounded-xl text-xs font-bold leading-relaxed">
          ⚠️ 呼び出しモニターで番号が表示されましたら、レジへお越しいただき<span class="underline decoration-red-500 font-extrabold">お会計・お受け取り</span>をお願いします。
        </div>
        <button id="btn-new-order" class="bg-slate-700 hover:bg-slate-800 text-white text-xs font-bold px-4 py-2 rounded-xl">
          新しい注文をする
        </button>
      </div>

      <!-- 注文フォーム -->
      <div id="order-form-card" class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 space-y-6">
        <div>
          <h2 class="text-lg font-bold text-slate-800 border-b pb-2 flex items-center gap-2">
            <i class="fa-solid fa-utensils text-red-600"></i> 商品と個数を選んでください
          </h2>
        </div>

        <div class="space-y-4">
          <!-- フランクフルト -->
          <div class="flex items-center justify-between bg-slate-50 p-4 rounded-xl border border-slate-200">
            <div>
              <h3 class="font-bold text-slate-800 text-base">🌭 フランクフルト</h3>
              <p class="text-xs text-slate-500">パリッとジューシー</p>
            </div>
            <div class="flex items-center gap-3">
              <button class="btn-qty bg-slate-200 text-slate-700 w-8 h-8 rounded-full font-bold text-lg flex items-center justify-center active:scale-95" onclick="changeQty('frank', -1)">-</button>
              <span id="qty-frank" class="font-bold text-lg w-6 text-center">0</span>
              <button class="btn-qty bg-red-600 text-white w-8 h-8 rounded-full font-bold text-lg flex items-center justify-center active:scale-95" onclick="changeQty('frank', 1)">+</button>
            </div>
          </div>

          <!-- ホットドッグ -->
          <div class="flex items-center justify-between bg-slate-50 p-4 rounded-xl border border-slate-200">
            <div>
              <h3 class="font-bold text-slate-800 text-base">🥖 ホットドッグ</h3>
              <p class="text-xs text-slate-500">特製パン挟み</p>
            </div>
            <div class="flex items-center gap-3">
              <button class="btn-qty bg-slate-200 text-slate-700 w-8 h-8 rounded-full font-bold text-lg flex items-center justify-center active:scale-95" onclick="changeQty('dog', -1)">-</button>
              <span id="qty-dog" class="font-bold text-lg w-6 text-center">0</span>
              <button class="btn-qty bg-red-600 text-white w-8 h-8 rounded-full font-bold text-lg flex items-center justify-center active:scale-95" onclick="changeQty('dog', 1)">+</button>
            </div>
          </div>
        </div>

        <button id="btn-submit-order" class="w-full bg-red-600 hover:bg-red-700 text-white font-extrabold text-lg py-4 rounded-xl shadow-lg shadow-red-600/30 active:scale-95 transition">
          注文を送信して整理券を発行する
        </button>
      </div>

    </section>

    <!-- 2. モニター表示画面 -->
    <section id="view-monitor" class="hidden space-y-6">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <!-- 焼きたて！お呼び出し中 -->
        <div class="md:col-span-2 bg-white rounded-2xl p-5 shadow-sm border border-slate-200">
          <div class="flex items-center gap-2 border-b-2 border-green-500 pb-3 mb-4">
            <i class="fa-solid fa-bell text-green-600 text-xl"></i>
            <h2 class="text-lg font-bold text-green-700">お呼び出し中（お会計へお越しください）</h2>
          </div>
          <div id="monitor-ready-list" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 gap-3"></div>
          <div id="monitor-ready-empty" class="text-center text-slate-400 py-12 text-sm font-medium">現在呼び出し中の番号はありません</div>
        </div>

        <!-- 調理中 -->
        <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200">
          <div class="flex items-center gap-2 border-b-2 border-amber-500 pb-3 mb-4">
            <i class="fa-solid fa-fire text-amber-500 text-xl"></i>
            <h2 class="text-lg font-bold text-amber-700">ただいま調理中</h2>
          </div>
          <div id="monitor-cooking-list" class="grid grid-cols-3 sm:grid-cols-3 gap-2"></div>
          <div id="monitor-cooking-empty" class="text-center text-slate-400 py-12 text-sm font-medium">調理中の番号はありません</div>
        </div>
      </div>
    </section>

    <!-- 3. スタッフ専用管理画面 -->
    <section id="view-staff" class="hidden space-y-6">
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex justify-between items-center">
        <h2 class="font-bold text-slate-800 text-base flex items-center gap-2">
          <i class="fa-solid fa-user-gear text-red-600"></i> スタッフ管理パネル
        </h2>
        <button id="btn-reset-all" class="bg-slate-500 hover:bg-slate-600 text-white text-xs font-bold px-3 py-2 rounded-lg">
          全データリセット
        </button>
      </div>

      <!-- 3カラム表示 -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <!-- 1. 調理中 (注文一覧) -->
        <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-3">
          <h3 class="font-bold text-amber-700 border-b-2 border-amber-400 pb-2 flex justify-between items-center">
            <span>🔥 1. 調理中・未会計</span>
            <span id="count-cooking" class="text-xs bg-amber-100 text-amber-800 px-2 py-0.5 rounded-full">0</span>
          </h3>
          <div id="staff-cooking-list" class="space-y-2"></div>
        </div>

        <!-- 2. 呼び出し中 (お会計案内) -->
        <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-3">
          <h3 class="font-bold text-green-700 border-b-2 border-green-500 pb-2 flex justify-between items-center">
            <span>🔔 2. 呼び出し中</span>
            <span id="count-ready" class="text-xs bg-green-100 text-green-800 px-2 py-0.5 rounded-full">0</span>
          </h3>
          <div id="staff-ready-list" class="space-y-2"></div>
        </div>

        <!-- 3. お渡し完了 -->
        <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-3">
          <h3 class="font-bold text-slate-500 border-b-2 border-slate-300 pb-2 flex justify-between items-center">
            <span>✅ 3. お渡し完了</span>
            <span id="count-done" class="text-xs bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full">0</span>
          </h3>
          <div id="staff-done-list" class="space-y-2 max-h-[500px] overflow-y-auto"></div>
        </div>
      </div>
    </section>

  </main>

  <!-- モーダル: パスワード認証 -->
  <div id="modal-password" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-xs p-6 space-y-4 border border-slate-100">
      <div class="text-center">
        <h3 class="font-bold text-slate-800 text-base">スタッフ認証</h3>
        <p class="text-xs text-slate-500 mt-1">パスワードを入力してください</p>
      </div>
      <input type="password" id="input-password" placeholder="パスワード" class="w-full border border-slate-300 rounded-xl p-3 text-center text-lg outline-none focus:ring-2 focus:ring-red-500">
      <div class="flex gap-2">
        <button id="btn-cancel-pass" class="w-1/2 py-2.5 border border-slate-200 rounded-xl text-xs font-bold text-slate-600">キャンセル</button>
        <button id="btn-submit-pass" class="w-1/2 py-2.5 bg-red-600 text-white rounded-xl text-xs font-bold">ログイン</button>
      </div>
    </div>
  </div>

  <!-- Firebase v9 (Modular SDK) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      doc, 
      addDoc, 
      updateDoc, 
      deleteDoc, 
      query, 
      orderBy, 
      onSnapshot, 
      serverTimestamp, 
      getDocs, 
      writeBatch 
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDgjxiw-m0Vgk1X-yWRKrGsjXTAS4ZpDAM",
      authDomain: "telephone-99ed5.firebaseapp.com",
      projectId: "telephone-99ed5",
      storageBucket: "telephone-99ed5.firebasestorage.app",
      messagingSenderId: "609918192167",
      appId: "1:609918192167:web:4361772de1f08b029edc02"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const ADMIN_PASS = 'admin13570';
    let tapCount = 0;
    let tapTimer = null;
    let tickets = [];
    let currentMaxNumber = 0;

    let qtyState = { frank: 0, dog: 0 };

    // DOM Elements
    const logoIcon = document.getElementById('logo-icon');
    const modalPassword = document.getElementById('modal-password');
    const inputPassword = document.getElementById('input-password');
    const btnSubmitPass = document.getElementById('btn-submit-pass');
    const btnCancelPass = document.getElementById('btn-cancel-pass');

    const viewCustomerOrder = document.getElementById('view-customer-order');
    const viewMonitor = document.getElementById('view-monitor');
    const viewStaff = document.getElementById('view-staff');

    const btnShowOrderPage = document.getElementById('btn-show-order-page');
    const btnShowMonitorPage = document.getElementById('btn-show-monitor-page');
    const btnLogoutStaff = document.getElementById('btn-logout-staff');

    const btnSubmitOrder = document.getElementById('btn-submit-order');
    const orderFormCard = document.getElementById('order-form-card');
    const orderSuccessCard = document.getElementById('order-success-card');
    const myTicketNumber = document.getElementById('my-ticket-number');
    const myTicketDetail = document.getElementById('my-ticket-detail');
    const btnNewOrder = document.getElementById('btn-new-order');

    const monitorReadyList = document.getElementById('monitor-ready-list');
    const monitorReadyEmpty = document.getElementById('monitor-ready-empty');
    const monitorCookingList = document.getElementById('monitor-cooking-list');
    const monitorCookingEmpty = document.getElementById('monitor-cooking-empty');

    const staffCookingList = document.getElementById('staff-cooking-list');
    const staffReadyList = document.getElementById('staff-ready-list');
    const staffDoneList = document.getElementById('staff-done-list');

    // 数量変更
    window.changeQty = (item, delta) => {
      qtyState[item] = Math.max(0, qtyState[item] + delta);
      document.getElementById(`qty-${item}`).textContent = qtyState[item];
    };

    // Firebase リスナー
    function initFirestoreListener() {
      const q = query(collection(db, "frankfurt_orders"), orderBy("number", "asc"));
      onSnapshot(q, (snapshot) => {
        tickets = [];
        currentMaxNumber = 0;
        snapshot.forEach((docSnap) => {
          const item = { id: docSnap.id, ...docSnap.data() };
          tickets.push(item);
          if (item.number > currentMaxNumber) currentMaxNumber = item.number;
        });
        render();
      });
    }

    // 注文送信
    btnSubmitOrder.addEventListener('click', async () => {
      if (qtyState.frank === 0 && qtyState.dog === 0) {
        alert('商品を1点以上選んでください');
        return;
      }

      const nextNum = currentMaxNumber + 1;
      const orderItems = [];
      if (qtyState.frank > 0) orderItems.push(`フランクフルト × ${qtyState.frank}`);
      if (qtyState.dog > 0) orderItems.push(`ホットドッグ × ${qtyState.dog}`);
      const orderSummary = orderItems.join(', ');

      try {
        await addDoc(collection(db, "frankfurt_orders"), {
          number: nextNum,
          summary: orderSummary,
          frankQty: qtyState.frank,
          dogQty: qtyState.dog,
          status: 'cooking',
          createdAt: serverTimestamp()
        });

        // 完了表示
        myTicketNumber.textContent = `#${nextNum}`;
        myTicketDetail.textContent = orderSummary;
        orderFormCard.classList.add('hidden');
        orderSuccessCard.classList.remove('hidden');

        // カウントリセット
        qtyState = { frank: 0, dog: 0 };
        document.getElementById('qty-frank').textContent = '0';
        document.getElementById('qty-dog').textContent = '0';
      } catch (e) {
        console.error("注文エラー:", e);
      }
    });

    btnNewOrder.addEventListener('click', () => {
      orderSuccessCard.classList.add('hidden');
      orderFormCard.classList.remove('hidden');
    });

    // 描画処理
    function render() {
      const readyTickets = tickets.filter(t => t.status === 'ready');
      const cookingTickets = tickets.filter(t => t.status === 'cooking');

      // モニター
      monitorReadyList.innerHTML = '';
      if (readyTickets.length === 0) {
        monitorReadyEmpty.classList.remove('hidden');
      } else {
        monitorReadyEmpty.classList.add('hidden');
        readyTickets.forEach(t => {
          const div = document.createElement('div');
          div.className = 'bg-green-50 border-2 border-green-500 text-green-700 rounded-2xl py-3 text-center text-3xl font-extrabold shadow-sm animate-ready';
          div.textContent = t.number;
          monitorReadyList.appendChild(div);
        });
      }

      monitorCookingList.innerHTML = '';
      if (cookingTickets.length === 0) {
        monitorCookingEmpty.classList.remove('hidden');
      } else {
        monitorCookingEmpty.classList.add('hidden');
        cookingTickets.forEach(t => {
          const div = document.createElement('div');
          div.className = 'bg-amber-50 border border-amber-300 text-amber-700 rounded-xl py-2 text-center text-xl font-bold';
          div.textContent = t.number;
          monitorCookingList.appendChild(div);
        });
      }

      // スタッフ管理画面
      staffCookingList.innerHTML = '';
      staffReadyList.innerHTML = '';
      staffDoneList.innerHTML = '';

      document.getElementById('count-cooking').textContent = cookingTickets.length;
      document.getElementById('count-ready').textContent = readyTickets.length;
      document.getElementById('count-done').textContent = tickets.filter(t => t.status === 'done').length;

      tickets.forEach(t => {
        const item = document.createElement('div');
        item.className = 'bg-slate-50 p-3 rounded-xl border border-slate-200 space-y-2 shadow-sm';

        if (t.status === 'cooking') {
          item.innerHTML = `
            <div class="flex justify-between items-start">
              <div>
                <span class="text-xl font-extrabold text-slate-800">#${t.number}</span>
                <p class="text-xs font-bold text-red-600 mt-0.5">${t.summary || ''}</p>
              </div>
              <button class="bg-red-500 text-white text-[10px] px-2 py-1 rounded" onclick="deleteTicket('${t.id}')">削除</button>
            </div>
            <button class="w-full bg-green-600 hover:bg-green-700 text-white text-xs font-bold py-2 rounded-lg" onclick="updateStatus('${t.id}', 'ready')">呼び出す（お会計案内）</button>
          `;
          staffCookingList.appendChild(item);
        } else if (t.status === 'ready') {
          item.innerHTML = `
            <div class="flex justify-between items-start">
              <div>
                <span class="text-xl font-extrabold text-green-600">#${t.number}</span>
                <p class="text-xs font-bold text-slate-700 mt-0.5">${t.summary || ''}</p>
              </div>
              <button class="bg-slate-200 text-slate-600 text-[10px] px-2 py-1 rounded" onclick="updateStatus('${t.id}', 'cooking')">戻す</button>
            </div>
            <button class="w-full bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold py-2 rounded-lg" onclick="updateStatus('${t.id}', 'done')">お渡し・会計完了</button>
          `;
          staffReadyList.appendChild(item);
        } else if (t.status === 'done') {
          item.innerHTML = `
            <div class="flex justify-between items-center">
              <div>
                <span class="text-sm font-bold text-slate-400">#${t.number}</span>
                <span class="text-xs text-slate-500 ml-2">${t.summary || ''}</span>
              </div>
              <button class="bg-slate-200 text-slate-600 text-[10px] px-2 py-1 rounded" onclick="updateStatus('${t.id}', 'ready')">戻す</button>
            </div>
          `;
          staffDoneList.prepend(item);
        }
      });
    }

    // ステータス更新 & 削除
    window.updateStatus = async (id, status) => {
      try {
        await updateDoc(doc(db, "frankfurt_orders", id), { status });
      } catch (e) {
        console.error(e);
      }
    };

    window.deleteTicket = async (id) => {
      try {
        await deleteDoc(doc(db, "frankfurt_orders", id));
      } catch (e) {
        console.error(e);
      }
    };

    document.getElementById('btn-reset-all').addEventListener('click', async () => {
      if (!confirm('全データ（注文・整理券）を削除してリセットしますか？')) return;
      const snapshot = await getDocs(collection(db, "frankfurt_orders"));
      const batch = writeBatch(db);
      snapshot.forEach(docSnap => batch.delete(docSnap.ref));
      await batch.commit();
    });

    // 画面切り替え
    btnShowOrderPage.addEventListener('click', () => {
      viewCustomerOrder.classList.remove('hidden');
      viewMonitor.classList.add('hidden');
      viewStaff.classList.add('hidden');
    });

    btnShowMonitorPage.addEventListener('click', () => {
      viewCustomerOrder.classList.add('hidden');
      viewMonitor.classList.remove('hidden');
      viewStaff.classList.add('hidden');
    });

    btnLogoutStaff.addEventListener('click', () => {
      viewStaff.classList.add('hidden');
      btnLogoutStaff.classList.add('hidden');
      viewCustomerOrder.classList.remove('hidden');
    });

    // 5回タップ認証
    logoIcon.addEventListener('click', () => {
      tapCount++;
      clearTimeout(tapTimer);
      if (tapCount >= 5) {
        tapCount = 0;
        inputPassword.value = '';
        modalPassword.classList.remove('hidden');
        inputPassword.focus();
      } else {
        tapTimer = setTimeout(() => { tapCount = 0; }, 1500);
      }
    });

    btnCancelPass.addEventListener('click', () => modalPassword.classList.add('hidden'));

    btnSubmitPass.addEventListener('click', checkPassword);
    inputPassword.addEventListener('keypress', (e) => { if (e.key === 'Enter') checkPassword(); });

    function checkPassword() {
      if (inputPassword.value === ADMIN_PASS) {
        modalPassword.classList.add('hidden');
        viewCustomerOrder.classList.add('hidden');
        viewMonitor.classList.add('hidden');
        viewStaff.classList.remove('hidden');
        btnLogoutStaff.classList.remove('hidden');
      } else {
        alert('パスワードが違います');
        inputPassword.value = '';
      }
    }

    initFirestoreListener();
  </script>
</body>
</html>

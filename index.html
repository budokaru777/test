<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>フランクフルト整理券管理システム (クラウド同期版)</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* 呼び出しカードのアニメーション */
    @keyframes pulse-glow {
      0%, 100% { transform: scale(1); border-color: #22c55e; box-shadow: 0 0 10px rgba(34, 197, 94, 0.2); }
      50% { transform: scale(1.03); border-color: #16a34a; box-shadow: 0 0 20px rgba(34, 197, 94, 0.5); }
    }

    .animate-ready {
      animation: pulse-glow 1.5s infinite ease-in-out;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col font-sans">

  <!-- ヘッダー -->
  <header class="bg-red-600 text-white px-4 py-3 shadow-md flex justify-between items-center sticky top-0 z-30">
    <div class="flex items-center gap-3">
      <!-- 5回タップターゲット -->
      <span id="logo-icon" class="text-2xl cursor-pointer active:scale-95 transition-transform p-1">🌭</span>
      <h1 class="text-lg font-bold tracking-tight">フランクフルトお呼び出し</h1>
    </div>
    
    <!-- スタッフ画面時のみ表示されるログアウトボタン -->
    <button id="btn-logout" class="hidden bg-white/20 hover:bg-white/30 text-white border border-white/30 text-xs font-bold px-3 py-1.5 rounded-lg transition">
      <i class="fa-solid fa-desktop mr-1"></i> モニタ画面へ戻る
    </button>
  </header>

  <!-- メインコンテンツ -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4">

    <!-- 1. お客様用モニタ画面 (初期表示) -->
    <section id="view-monitor" class="space-y-6">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <!-- 焼きたて！お呼び出し中 (2カラム幅) -->
        <div class="md:col-span-2 bg-white rounded-2xl p-5 shadow-sm border border-slate-200">
          <div class="flex items-center gap-2 border-b-2 border-green-500 pb-3 mb-4">
            <i class="fa-solid fa-bell text-green-600 text-xl"></i>
            <h2 class="text-lg font-bold text-green-700">焼きたて！お呼び出し中</h2>
          </div>
          <div id="monitor-ready-list" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 gap-3">
            <!-- JSで呼び出し中カードを生成 -->
          </div>
          <div id="monitor-ready-empty" class="text-center text-slate-400 py-12 text-sm font-medium">
            現在呼び出し中の番号はありません
          </div>
        </div>

        <!-- ただいま調理中 (1カラム幅) -->
        <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200">
          <div class="flex items-center gap-2 border-b-2 border-amber-500 pb-3 mb-4">
            <i class="fa-solid fa-fire text-amber-500 text-xl"></i>
            <h2 class="text-lg font-bold text-amber-700">ただいま調理中</h2>
          </div>
          <div id="monitor-cooking-list" class="grid grid-cols-3 sm:grid-cols-3 gap-2">
            <!-- JSで調理中カードを生成 -->
          </div>
          <div id="monitor-cooking-empty" class="text-center text-slate-400 py-12 text-sm font-medium">
            調理中の番号はありません
          </div>
        </div>

      </div>
    </section>

    <!-- 2. スタッフ専用管理画面 (非表示) -->
    <section id="view-staff" class="hidden space-y-6">
      
      <!-- コントロールバー -->
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex flex-wrap justify-between items-center gap-4">
        <button id="btn-issue" class="bg-red-600 hover:bg-red-700 text-white font-bold text-lg px-6 py-3 rounded-xl shadow-lg shadow-red-600/30 active:scale-95 transition flex items-center gap-2">
          <i class="fa-solid fa-plus"></i> 新規発券（会計完了）
        </button>

        <button id="btn-reset" class="bg-slate-500 hover:bg-slate-600 text-white text-xs font-bold px-3 py-2 rounded-lg transition">
          <i class="fa-solid fa-rotate-right mr-1"></i> 全データをリセット
        </button>
      </div>

      <!-- ステータス別リスト (3カラム) -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        
        <!-- 1. 調理中 -->
        <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-3">
          <h3 class="font-bold text-amber-700 border-b-2 border-amber-400 pb-2 flex justify-between items-center">
            <span>🔥 1. 調理中</span>
            <span id="count-cooking" class="text-xs bg-amber-100 text-amber-800 px-2 py-0.5 rounded-full">0</span>
          </h3>
          <div id="staff-cooking-list" class="space-y-2"></div>
        </div>

        <!-- 2. 呼び出し中 -->
        <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-3">
          <h3 class="font-bold text-green-700 border-b-2 border-green-500 pb-2 flex justify-between items-center">
            <span>🔔 2. 呼び出し中</span>
            <span id="count-ready" class="text-xs bg-green-100 text-green-800 px-2 py-0.5 rounded-full">0</span>
          </h3>
          <div id="staff-ready-list" class="space-y-2"></div>
        </div>

        <!-- 3. お渡し完了 -->
        <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-3">
          <h3 class="font-bold text-slate-500 border-b-2 border-slate-300 pb-2 flex justify-between items-center">
            <span>✅ 3. お渡し完了</span>
            <span id="count-done" class="text-xs bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full">0</span>
          </h3>
          <div id="staff-done-list" class="space-y-2 max-h-[500px] overflow-y-auto"></div>
        </div>

      </div>
    </section>

  </main>

  <!-- モーダル: パスワード認証 -->
  <div id="modal-password" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-xs p-6 space-y-4 border border-slate-100">
      <div class="text-center">
        <h3 class="font-bold text-slate-800 text-base">スタッフ認証</h3>
        <p class="text-xs text-slate-500 mt-1">パスワードを入力してください</p>
      </div>

      <input type="password" id="input-password" placeholder="パスワード" class="w-full border border-slate-300 rounded-xl p-3 text-center text-lg outline-none focus:ring-2 focus:ring-red-500">

      <div class="flex gap-2">
        <button id="btn-cancel-pass" class="w-1/2 py-2.5 border border-slate-200 rounded-xl text-xs font-bold text-slate-600 hover:bg-slate-50">キャンセル</button>
        <button id="btn-submit-pass" class="w-1/2 py-2.5 bg-red-600 text-white rounded-xl text-xs font-bold hover:bg-red-700 shadow-md">ログイン</button>
      </div>
    </div>
  </div>

  <!-- Firebase v9 (Modular SDK) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      doc,
      setDoc,
      addDoc, 
      updateDoc,
      deleteDoc,
      query, 
      orderBy, 
      onSnapshot, 
      serverTimestamp,
      getDocs,
      writeBatch
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // Firebase Configuration (プロジェクト設定)
    const firebaseConfig = {
      apiKey: "AIzaSyDgjxiw-m0Vgk1X-yWRKrGsjXTAS4ZpDAM",
      authDomain: "telephone-99ed5.firebaseapp.com",
      projectId: "telephone-99ed5",
      storageBucket: "telephone-99ed5.firebasestorage.app",
      messagingSenderId: "609918192167",
      appId: "1:609918192167:web:4361772de1f08b029edc02"
    };

    // Firebase 初期化
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const ADMIN_PASS = 'admin13570';
    let tapCount = 0;
    let tapTimer = null;
    let tickets = [];
    let currentMaxNumber = 0;

    // DOM Elements
    const logoIcon = document.getElementById('logo-icon');
    const modalPassword = document.getElementById('modal-password');
    const inputPassword = document.getElementById('input-password');
    const btnSubmitPass = document.getElementById('btn-submit-pass');
    const btnCancelPass = document.getElementById('btn-cancel-pass');
    const btnLogout = document.getElementById('btn-logout');

    const viewMonitor = document.getElementById('view-monitor');
    const viewStaff = document.getElementById('view-staff');

    const monitorReadyList = document.getElementById('monitor-ready-list');
    const monitorReadyEmpty = document.getElementById('monitor-ready-empty');
    const monitorCookingList = document.getElementById('monitor-cooking-list');
    const monitorCookingEmpty = document.getElementById('monitor-cooking-empty');

    const btnIssue = document.getElementById('btn-issue');
    const btnReset = document.getElementById('btn-reset');
    const staffCookingList = document.getElementById('staff-cooking-list');
    const staffReadyList = document.getElementById('staff-ready-list');
    const staffDoneList = document.getElementById('staff-done-list');

    // --- Firebase リアルタイム同期リスナー ---
    function initFirestoreListener() {
      const q = query(collection(db, "frankfurt_tickets"), orderBy("number", "asc"));
      
      onSnapshot(q, (snapshot) => {
        tickets = [];
        currentMaxNumber = 0;

        snapshot.forEach((docSnap) => {
          const data = docSnap.data();
          const item = { id: docSnap.id, ...data };
          tickets.push(item);

          if (item.number > currentMaxNumber) {
            currentMaxNumber = item.number;
          }
        });

        render();
      });
    }

    // --- 画面描画 ---
    function render() {
      // 1. モニター画面 (お客様用)
      const readyTickets = tickets.filter(t => t.status === 'ready');
      const cookingTickets = tickets.filter(t => t.status === 'cooking');

      // 呼び出し中
      monitorReadyList.innerHTML = '';
      if (readyTickets.length === 0) {
        monitorReadyEmpty.classList.remove('hidden');
      } else {
        monitorReadyEmpty.classList.add('hidden');
        readyTickets.forEach(t => {
          const div = document.createElement('div');
          div.className = 'bg-green-50 border-2 border-green-500 text-green-700 rounded-2xl py-3 text-center text-3xl font-extrabold shadow-sm animate-ready';
          div.textContent = t.number;
          monitorReadyList.appendChild(div);
        });
      }

      // 調理中
      monitorCookingList.innerHTML = '';
      if (cookingTickets.length === 0) {
        monitorCookingEmpty.classList.remove('hidden');
      } else {
        monitorCookingEmpty.classList.add('hidden');
        cookingTickets.forEach(t => {
          const div = document.createElement('div');
          div.className = 'bg-amber-50 border border-amber-300 text-amber-700 rounded-xl py-2 text-center text-xl font-bold';
          div.textContent = t.number;
          monitorCookingList.appendChild(div);
        });
      }

      // 2. スタッフ管理画面
      staffCookingList.innerHTML = '';
      staffReadyList.innerHTML = '';
      staffDoneList.innerHTML = '';

      document.getElementById('count-cooking').textContent = cookingTickets.length;
      document.getElementById('count-ready').textContent = readyTickets.length;
      document.getElementById('count-done').textContent = tickets.filter(t => t.status === 'done').length;

      tickets.forEach(t => {
        const item = document.createElement('div');
        item.className = 'bg-slate-50 p-3 rounded-xl border border-slate-200 flex justify-between items-center shadow-sm';

        if (t.status === 'cooking') {
          item.innerHTML = `
            <span class="text-xl font-extrabold text-slate-800">#${t.number}</span>
            <div class="flex gap-1.5">
              <button class="bg-green-600 hover:bg-green-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg transition" onclick="updateStatus('${t.id}', 'ready')">呼び出す</button>
              <button class="bg-red-500 hover:bg-red-600 text-white text-xs font-bold px-2 py-1.5 rounded-lg transition" onclick="deleteTicket('${t.id}')"><i class="fa-solid fa-trash"></i></button>
            </div>
          `;
          staffCookingList.appendChild(item);
        } else if (t.status === 'ready') {
          item.innerHTML = `
            <span class="text-xl font-extrabold text-green-600">#${t.number}</span>
            <div class="flex gap-1.5">
              <button class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg transition" onclick="updateStatus('${t.id}', 'done')">お渡し完了</button>
              <button class="bg-slate-200 text-slate-600 text-xs font-bold px-2 py-1.5 rounded-lg hover:bg-slate-300" onclick="updateStatus('${t.id}', 'cooking')">戻す</button>
            </div>
          `;
          staffReadyList.appendChild(item);
        } else if (t.status === 'done') {
          item.innerHTML = `
            <span class="text-sm font-bold text-slate-400">#${t.number}</span>
            <button class="bg-slate-200 text-slate-600 text-[10px] font-bold px-2 py-1 rounded-lg hover:bg-slate-300" onclick="updateStatus('${t.id}', 'ready')">戻す</button>
          `;
          staffDoneList.prepend(item);
        }
      });
    }

    // --- Firebase 操作関数 ---
    window.updateStatus = async (id, status) => {
      try {
        await updateDoc(doc(db, "frankfurt_tickets", id), { status });
      } catch (err) {
        console.error("更新エラー:", err);
      }
    };

    window.deleteTicket = async (id) => {
      try {
        await deleteDoc(doc(db, "frankfurt_tickets", id));
      } catch (err) {
        console.error("削除エラー:", err);
      }
    };

    btnIssue.addEventListener('click', async () => {
      const nextNum = currentMaxNumber + 1;
      try {
        await addDoc(collection(db, "frankfurt_tickets"), {
          number: nextNum,
          status: 'cooking',
          createdAt: serverTimestamp()
        });
      } catch (err) {
        console.error("発券エラー:", err);
      }
    });

    btnReset.addEventListener('click', async () => {
      if (!confirm('本日のすべての整理券データをクラウド上から消去しますか？')) return;

      try {
        const snapshot = await getDocs(collection(db, "frankfurt_tickets"));
        const batch = writeBatch(db);
        snapshot.forEach((docSnap) => {
          batch.delete(docSnap.ref);
        });
        await batch.commit();
      } catch (err) {
        console.error("リセットエラー:", err);
      }
    });

    // --- 5回タップ ＆ 隠し認証 ---
    logoIcon.addEventListener('click', () => {
      tapCount++;
      clearTimeout(tapTimer);

      if (tapCount >= 5) {
        tapCount = 0;
        inputPassword.value = '';
        modalPassword.classList.remove('hidden');
        inputPassword.focus();
      } else {
        tapTimer = setTimeout(() => {
          tapCount = 0;
        }, 1500);
      }
    });

    btnCancelPass.addEventListener('click', () => modalPassword.classList.add('hidden'));

    btnSubmitPass.addEventListener('click', checkPassword);
    inputPassword.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') checkPassword();
    });

    function checkPassword() {
      if (inputPassword.value === ADMIN_PASS) {
        modalPassword.classList.add('hidden');
        viewMonitor.classList.add('hidden');
        viewStaff.classList.remove('hidden');
        btnLogout.classList.remove('hidden');
      } else {
        alert('パスワードが正しくありません');
        inputPassword.value = '';
      }
    }

    btnLogout.addEventListener('click', () => {
      viewStaff.classList.add('hidden');
      btnLogout.classList.add('hidden');
      viewMonitor.classList.remove('hidden');
    });

    // 初期化実行
    initFirestoreListener();
  </script>
</body>
</html>
